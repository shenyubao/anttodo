name: Publish AntTodo CLI

on:
  workflow_dispatch:
  push:
    tags:
      - "cli-v*"

concurrency:
  group: publish-cli-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/cli-v')
        run: |
          tag_version="${GITHUB_REF_NAME#cli-v}"
          package_version="$(node -p "JSON.parse(require('fs').readFileSync('cli/package.json', 'utf8')).version")"
          test "$tag_version" = "$package_version"

      - name: Bump CLI version
        if: github.event_name == 'workflow_dispatch'
        run: pnpm bump:cli-version

      - name: Verify CLI
        run: pnpm cli:verify

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish ./cli --access public --provenance
