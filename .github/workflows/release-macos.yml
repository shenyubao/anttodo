name: Release macOS to R2

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-and-upload:
    runs-on: macos-14
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
      R2_PREFIX: ${{ vars.R2_PREFIX }}
      VITE_PUBLIC_APP_URL: ${{ vars.VITE_PUBLIC_APP_URL || 'https://app.anttodo.com' }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package Apple Silicon and Intel builds
        run: pnpm package:mac:all

      - name: Upload packages and latest aliases to R2
        if: startsWith(github.ref, 'refs/tags/')
        run: pnpm upload:mac:r2 -- --expected-version="${GITHUB_REF_NAME}"

      - name: Upload packages and latest aliases to R2 (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: pnpm upload:mac:r2

      - name: Keep workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AntTodo-macOS-${{ github.ref_name }}
          path: |
            release/*.dmg
            release/*.zip
            release/macos-latest.json
          if-no-files-found: error
          retention-days: 14
