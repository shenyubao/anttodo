<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f7f9" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("anttodo:theme-preference");
          var preference = raw ? JSON.parse(raw) : null;
          var followSystem = !preference || preference.followSystem !== false;
          var theme = preference && preference.theme === "dark" ? "dark" : "default";
          var isDark = followSystem
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
            : theme === "dark";
          document.documentElement.classList.toggle("dark", isDark);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", isDark ? "#1f1f1f" : "#f6f7f9");
        } catch (_) {
          /* keep default light theme */
        }
      })();
    </script>
    <script>
      if (window.location.protocol === "http:" || window.location.protocol === "https:") {
        const base = document.createElement("base");
        base.href = "/";
        document.head.append(base);
      }
    </script>
    <title>蚂蚁清单</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
